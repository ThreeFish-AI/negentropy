/* ============================ 2. 引擎层 ============================ */
function lerp(a, b, k) { return a + (b - a) * k; }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
/* 确定性伪随机（保证每次重放画面一致，便于分段录屏） */
function srand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* 缓动函数（一切出现必缓动，禁 linear） */
const Ease = {
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inOutQuad: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => { const c4 = (2 * Math.PI) / 3; return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1; },
};

/* 中文断行 helper：按像素宽度贪心断行 + 禁则（行首不出 空格 。，、！？；：等） */
const LINEBREAK_FORBIDDEN = '。，、；：！？）」』】》>,.!?;:%…—·';
function wrapText(ctx, str, maxW) {
  const toks = str.match(/[A-Za-z0-9][A-Za-z0-9\-+*/=%.×'&$_]*|\s+|./gu) || [];
  const lines = [];
  let line = '', lw = 0;
  for (const tok of toks) {
    if (tok === '\n') { lines.push(line); line = ''; lw = 0; continue; }
    if (line === '' && /^\s+$/.test(tok)) continue;           /* 行首不出空格 */
    const w = ctx.measureText(tok).width;
    if (lw + w <= maxW || line === '') { line += tok; lw += w; continue; }
    if (LINEBREAK_FORBIDDEN.includes(tok[0]) && line.length > 1) {
      /* 禁则：下一 token 首字符为标点 → 把行尾字一并带下去，避免标点落行首 */
      const last = line.slice(-1);
      line = line.slice(0, -1);
      lines.push(line);
      line = last + tok;
      lw = ctx.measureText(line).width;
    } else {
      lines.push(line);
      line = tok; lw = w;
    }
  }
  if (line !== '') lines.push(line);
  return lines;
}

/* ---------- 绘制助手 ---------- */
function setF(ctx, weight, size) { ctx.font = weight + ' ' + size + 'px ' + FS; }
function txt(ctx, s, x, y, o = {}) {
  const a = o.alpha == null ? 1 : o.alpha;
  if (a <= 0 || !s) return;
  setF(ctx, o.weight || 400, o.size || 28);
  ctx.save();
  ctx.globalAlpha = a;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 24; }
  ctx.fillStyle = o.color || C.fg;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillText(s, x, y);
  ctx.restore();
}
/* 段落：自动断行绘制，返回总高度 */
function para(ctx, str, x, y, maxW, o = {}) {
  const size = o.size || 26, lh = o.lh || size * 1.55;
  setF(ctx, o.weight || 400, size);
  const lines = wrapText(ctx, str, maxW);
  lines.forEach((ln, i) => {
    txt(ctx, ln, x, y + i * lh + size * 0.8, {
      size, weight: o.weight || 400, color: o.color, alpha: o.alpha,
      align: o.align || 'left',
    });
  });
  return lines.length * lh;
}
/* 主字符 + 下标（用于 θ_t / S_t / θ_{t+1}），返回总宽 */
function subTxt(ctx, main, sub, x, y, o = {}) {
  const ms = o.size || 40, ss = Math.round(ms * 0.55);
  setF(ctx, o.weight || 700, ms); const mw = ctx.measureText(main).width;
  setF(ctx, 400, ss); const sw = ctx.measureText(sub).width;
  const w = mw + sw * 0.9;
  const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  txt(ctx, main, x0, y, { size: ms, weight: o.weight || 700, color: o.color, alpha: o.alpha });
  txt(ctx, sub, x0 + mw, y + ss * 0.6, { size: ss, weight: 400, color: o.color, alpha: o.alpha });
  return w;
}
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function nodeC(ctx, x, y, r, o = {}) {
  const a = o.alpha == null ? 1 : o.alpha;

/* 直线箭头：p 为描边进度 0→1，头部始终跟在笔尖 */
function arrow(ctx, x1, y1, x2, y2, o = {}) {
  const p = clamp01(o.p == null ? 1 : o.p), a = o.alpha == null ? 1 : o.alpha;
  if (p <= 0 || a <= 0) return;

  ctx.setLineDash([]);

}
/* 二次贝塞尔曲线（描边进度 p） */
function qcurve(ctx, x1, y1, cx, cy, x2, y2, o = {}) {
  const p = clamp01(o.p == null ? 1 : o.p), a = o.alpha == null ? 1 : o.alpha;
  if (p <= 0 || a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = o.color || C.fg; ctx.lineWidth = o.width || 3; ctx.lineCap = 'round';
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath();
  const N = 44;
  for (let i = 0; i <= N * p; i++) {
    const u = i / N;
    const x = (1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * cx + u * u * x2;
    const y = (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * cy + u * u * y2;

}
/* 圆弧箭头（含箭头头部，p 为进度） */
function arcArrow(ctx, x, y, r, a0, a1, o = {}) {
  const p = clamp01(o.p == null ? 1 : o.p), a = o.alpha == null ? 1 : o.alpha;
  if (p <= 0 || a <= 0) return;

  ctx.setLineDash([]);
  if (o.head !== false) {
    const hs = o.head || 14;
    const tx = x + Math.cos(aEnd) * r, ty = y + Math.sin(aEnd) * r;
    const tX = -Math.sin(aEnd) * sg, tY = Math.cos(aEnd) * sg;
    const nX = Math.cos(aEnd), nY = Math.sin(aEnd);

    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - tX * hs + nX * hs * 0.45, ty - tY * hs + nY * hs * 0.45);
    ctx.lineTo(tx - tX * hs - nX * hs * 0.45, ty - tY * hs - nY * hs * 0.45);

  }
  ctx.restore();
}

/* 下划线/分隔线描边 */
function ruleLine(ctx, x, y, w, p, color, alpha, lw) {
  const a = alpha == null ? 1 : alpha;
  if (a <= 0 || p <= 0) return;

  const a = alpha == null ? 1 : alpha;

/* ---------- BaseScene：场景基类（场景内相对秒计时） ---------- */
class BaseScene {
  /* cfg: {id,title,duration,cues:[{id,label,start,end}]} */
  constructor(cfg) { Object.assign(this, cfg); this.t = 0; this.finished = false; this._tw = []; this._calls = []; }
  reset() { this.t = 0; this.finished = false; this._tw = []; this._calls = []; this.setup(); }
  /* 绝对时刻回调（场景相对秒） */
  at(time, fn) { this._calls.push({ t: time, fn, done: false }); }
  /* 绝对时刻补间：tw(targetObj, {props}, startSec, durSec, ease, onDone) */
  tw(target, props, start, dur, ease, onDone) {
    this._tw.push({ o: target, to: props, from: null, start, dur: Math.max(dur, 0.001), ease: ease || Ease.outCubic, onDone, dead: false });
  }
  update(dt) {
    if (!this.finished) {
      this.t += dt;
      if (this.t >= this.duration) { this.t = this.duration; this.finished = true; }
    }
    const t = this.t;
    for (const c of this._calls) { if (!c.done && t >= c.t) { c.done = true; c.fn(); } }
    for (const w of this._tw) {
      if (w.dead || t < w.start) continue;
      if (!w.from) { w.from = {}; for (const k in w.to) w.from[k] = w.o[k] || 0; }
      const k = clamp01((t - w.start) / w.dur), e = w.ease(k);
      for (const key in w.to) w.o[key] = w.from[key] + (w.to[key] - w.from[key]) * e;
      if (k >= 1) { w.dead = true; if (w.onDone) w.onDone(); }
    }
    if (this.onTick) this.onTick(dt, t);
  }
  setup() { }
  render(ctx) { }
}

/* ------------------------------------------------------------------
 * S1 大脑与装备（N1a,N1b · 0:40–1:55 · 时长 75s）
 * CUE_A 0–47s  智能体登场：中心大脑 θ + 环绕装备 Σ 四件套依次点亮
 * CUE_B 47–75s 类比切换：θ=出厂芯片（焊死）vs Σ=后装 APP（可装卸）
 * ------------------------------------------------------------------ */

  constructor() {
    super({
      id: 'S1', title: '大脑与装备', duration: 75, cues: [

    /* CUE_A */

    this.appSt = this.s.appGrid.map(() => ({ a: 0 }));
    this.appSt.forEach((a, i) => this.tw(a, { a: 1 }, 60 + i * 0.5, 0.7, Ease.outBack));

  render(ctx) {

  }

    const g = s.gA, cx = 760, cy = 560;

    for (let i = 0; i < 52; i++) {
      const ang = srand(i) * Math.PI * 2, rr = 30 + srand(i + 50) * 118;

    arrow(ctx, 1530, 685, 1700, 685, { p: s.linkP, color: C.green, alpha: s.linkP * g * 0.9, width: 4, head: 18 });
    txt(ctx, T.B.arrowLbl, 1615, 656, { size: 20, align: 'center', alpha: s.linkLbl * g * 0.8, color: C.green });
    card(ctx, 1730, 620, 200, 130, { alpha: s.slow * g * 0.9, stroke: C.fg, lw: 2.5, r: 18 });
    txt(ctx, 'θ', 1830, 676, { size: 42, weight: 700, align: 'center', alpha: s.slow * g });
    txt(ctx, '慢循环', 1830, 724, { size: 21, align: 'center', alpha: s.slow * g * 0.7 });
    para(ctx, T.B.fast, 1300, 800, 620, { size: 24, alpha: s.fast * g * 0.85 });
    para(ctx, T.B.slow, 1300, 870, 620, { size: 24, alpha: s.slow * g * 0.85 });
    txt(ctx, T.B.fsNote, 960, 1008, { size: 25, align: 'center', alpha: s.fsNote * g * 0.85 });
    txt(ctx, T.B.fsNote2, 960, 1046, { size: 25, align: 'center', alpha: s.fsNote2 * g * 0.7 });
  }
}
/* ------------------------------------------------------------------
 * S7 双循环收束（N6a,N6b · 12:13–13:42 · 时长 89s）
 * CUE_A 0–38s  智能爆炸虚线冲天 vs 现实阶梯爬坡对比校准
 * CUE_B 38–89s 双循环互锁图 + 四条件 + 金句 + 片尾出处
 * ------------------------------------------------------------------ */
class S7 extends BaseScene {
  constructor() {
    super({
      id: 'S7', title: '双循环收束', duration: 89, cues: [
        { id: 'A', label: '爆炸 vs 现实', start: 0, end: 38 },
        { id: 'B', label: '双循环+金句', start: 38, end: 89 },
      ],
    });
  }
  setup() {
    this.s = {
      gA: 1, gB: 0,
      boomT: 0, boomLine: 0, boomGlow: 0, boomB: 0, boomP: 0,
      hist: 0,
      realT: 0, realK: 0, realDim: 0,
      realB: 0, realC: 0, realD: 0, capA: 0,
      /* CUE_B */
      back: 0, ans: 0,
      loopT: 0, sA: 0, fastP: 0, slowP: 0, linkP: 0, linkBack: 0,
      golden1: 0, golden2: 0, outro: 0, srcA: 0,
    };
    /* CUE_A —— 智能爆炸（科幻线） */
    this.tw(this.s, { boomT: 1 }, 0.8, 0.9, Ease.outCubic);
    this.tw(this.s, { boomB: 1 }, 1.8, 0.9, Ease.outCubic);
    this.tw(this.s, { boomP: 1 }, 2.6, 1.2, Ease.inOutCubic);
    this.tw(this.s, { boomLine: 1 }, 3.4, 1.6, Ease.inCubic);
    this.tw(this.s, { boomGlow: 1 }, 5.0, 1.2, Ease.outCubic);
    /* 8.5s 现实阶梯切入：压暗爆炸线 */
    this.tw(this.s, { realT: 1 }, 8.5, 0.9, Ease.outCubic);
    this.tw(this.s, { realDim: 1 }, 9.0, 0.8, Ease.inOutCubic);
    this.tw(this.s, { realK: 1 }, 9.5, 5.0, Ease.inOutQuad);
    this.tw(this.s, { hist: 1 }, 14.0, 1.0, Ease.outCubic);
    this.tw(this.s, { realB: 1 }, 19.5, 1.0, Ease.outCubic);
    this.tw(this.s, { realC: 1 }, 23.5, 1.0, Ease.outCubic);
    this.tw(this.s, { realD: 1 }, 27.0, 1.0, Ease.outBack);
    /* CUE_B 38s —— 收束 */
    this.tw(this.s, { gA: 0, gB: 1 }, 38.0, 0.9, Ease.inOutCubic);
    this.tw(this.s, { back: 1 }, 39.0, 1.0, Ease.outCubic);
    this.tw(this.s, { ans: 1 }, 42.5, 0.9, Ease.outBack);
    this.condSt = [0, 0, 0, 0].map(() => ({ a: 0 }));
    this.condSt.forEach((c, i) => this.tw(c, { a: 1 }, 43.5 + i * 1.4, 0.8, Ease.outBack));
    this.tw(this.s, { capA: 1 }, 51.0, 0.9, Ease.outCubic);
    /* 双循环互锁 */
    this.tw(this.s, { sA: 1 }, 52.0, 0.8, Ease.outCubic);
    this.tw(this.s, { loopT: 1 }, 52.5, 0.9, Ease.outCubic);
    this.tw(this.s, { fastP: 1 }, 53.5, 1.8, Ease.inOutCubic);
    this.tw(this.s, { slowP: 1 }, 54.5, 2.8, Ease.inOutCubic);
    this.tw(this.s, { linkP: 1 }, 57.5, 1.0, Ease.inOutCubic);
    this.tw(this.s, { linkBack: 1 }, 59.0, 1.0, Ease.inOutCubic);
    /* 金句（强调：其余元素压暗） */
    this.tw(this.s, { golden1: 1 }, 70.0, 1.1, Ease.outBack);
    this.tw(this.s, { golden2: 1 }, 73.0, 1.1, Ease.outBack);
    this.tw(this.s, { outro: 1 }, 80.0, 1.0, Ease.outCubic);
    this.tw(this.s, { srcA: 1 }, 82.0, 1.0, Ease.outCubic);
  }
  render(ctx) {
    const T = sceneText.S7, s = this.s;
    if (s.gA > 0.01) this.drawA(ctx, T, s);
    if (s.gB > 0.01) this.drawB(ctx, T, s);
  }
  /* —— CUE_A：智能爆炸 vs 现实阶梯 —— */
  drawA(ctx, T, s) {
    const g = s.gA;
    txt(ctx, T.A.boomT, 500, 170, { size: 42, weight: 700, align: 'center', alpha: s.boomT * g });
    para(ctx, T.A.boomB, 500, 214, 420, { size: 25, align: 'center', alpha: s.boomT * g * 0.75 });
    /* 虚线冲天（科幻线，压暗给现实阶梯让位） */
    const bx = 500, by = 980;
    const glowP = 0.5 + 0.5 * Math.sin(this.t * 3.0);
    if (s.boomGlow > 0.01) dot(ctx, bx, by - 620 * clamp01(s.boomLine), 60 + glowP * 26, C.yellow, s.boomGlow * g * (1 - s.realDim * 0.8) * 0.18);
    qcurve(ctx, bx, by, bx + 6, by - 300, bx - 4, by - 620, { p: clamp01(s.boomLine), color: C.yellow, alpha: (1 - s.realDim * 0.75) * g * 0.95, width: 4, dash: [14, 12] });
    txt(ctx, '越改越聪明，越聪明越会改', bx, by + 46, { size: 22, align: 'center', alpha: (1 - s.realDim) * g * 0.7, color: C.yellow });
    /* 思想史小字 */
    para(ctx, T.A.hist, 980, 190, 880, { size: 25, alpha: s.hist * g * 0.75 });
    /* 现实阶梯（受限于验证器/数据/算力，被压平的上限线） */
    const ox = 980, oy = 980;
    txt(ctx, T.A.realT, 1400, 264, { size: 34, weight: 700, align: 'center', alpha: s.realT * g, color: C.green });
    const N = 22;
    const prog = clamp01(s.realK) * N;
    for (let i = 0; i < N; i++) {
      if (i > prog) break;
      const k = clamp01(prog - i);
      const sx = ox + i * 36, sy = oy - 60 - i * 24;
      ctx.save(); ctx.globalAlpha = k * g * 0.9;
      ctx.fillStyle = C.green;
      rrect(ctx, sx, sy - 26, 34, 30, 5); ctx.fill();
      ctx.restore();
      if (k >= 1) dot(ctx, sx + 17, sy - 40, 5, C.green, g * 0.7);
    }
    /* 三个约束标签 */
    para(ctx, T.A.realB, 1400, 320, 700, { size: 26, align: 'center', alpha: s.realB * g * 0.9 });
    para(ctx, T.A.realC, 120, 560, 700, { size: 27, alpha: s.realC * g * 0.9 });
    txt(ctx, T.A.realD, 470, 650, { size: 34, weight: 700, alpha: s.realD * g, color: C.green });
    txt(ctx, '科幻', bx - 130, 950, { size: 26, alpha: s.boomT * (1 - s.realDim * 0.6) * g * 0.6, color: C.yellow });
    txt(ctx, '现实', ox + 360, 950, { size: 26, alpha: s.realT * g * 0.7, color: C.green });
    txt(ctx, sceneText.global.paperSrc, W / 2, 1012, { size: 22, align: 'center', alpha: s.gA * 0.4 });
  }
  /* —— CUE_B：四条件 + 双循环 + 金句 —— */
  drawB(ctx, T, s) {
    const g = s.gB;
    /* 金句时刻：全局压暗强调 */
    const dim = 1 - (s.golden1 > 0.02 ? Math.min(s.golden1, 1) * 0.72 : 0);
    const dimQ = 1 - s.golden1 * 0.9; /* 问句与金句分区，各自淡出 */
    txt(ctx, T.B.back, W / 2, 128, { size: 30, align: 'center', alpha: s.back * g * dimQ * 0.85 });
    txt(ctx, T.B.ans, W / 2, 190, { size: 42, weight: 700, align: 'center', alpha: s.ans * g * dim, color: C.green, glow: C.green, glowBlur: 22 });
    /* 四个条件勾选（金句时压暗） */
    const conds = [T.B.c1, T.B.c2, T.B.c3, T.B.c4];
    conds.forEach((c, i) => {
      const a = this.condSt[i].a * g * dim;
      const cx0 = 200 + (i % 2) * 780, cy0 = 252 + ((i / 2) | 0) * 76;
      checkIcon(ctx, cx0, cy0 - 8, 22, C.green, a);
      txt(ctx, c, cx0 + 34, cy0, { size: 28, alpha: a * 0.92 });
    });
    /* 双循环互锁：外 θ 慢环 + 内 Σ 快环 + 互锁箭头 */
    const cx = 960, cy = 610, rO = 250, rI = 120;
    txt(ctx, T.B.loopT, 960, 296, { size: 30, weight: 700, align: 'center', alpha: s.loopT * g * dim });
    ctx.save(); ctx.globalAlpha = s.sA * g * dim * 0.9;
    nodeC(ctx, cx, cy, rI * 0.36, { color: C.fg, lw: 2.5, alpha: s.sA * g * dim, fill: C.fg });
    ctx.restore();
    txt(ctx, 'A=(θ,Σ)', cx, cy + 8, { size: 24, alpha: s.sA * g * dim * 0.8 });
    /* 外环 θ（慢） */
    arcArrow(ctx, cx, cy, rO, -Math.PI / 2 + 0.18, -Math.PI / 2 + Math.PI * 2 - 0.18, { p: s.slowP, color: C.fg, alpha: 0.85 * s.sA * g * dim, width: 4 });
    txt(ctx, T.B.loopSlow, cx, cy - rO - 20, { size: 26, weight: 700, align: 'center', alpha: s.slowP * g * dim * 0.9 });
    /* 内环 Σ（快） */
    arcArrow(ctx, cx, cy, rI, Math.PI / 2 - 0.3, Math.PI / 2 + Math.PI * 2 - 0.3, { p: s.fastP, color: C.green, alpha: 0.9 * s.sA * g * dim, width: 3.5 });
    txt(ctx, T.B.loopFast, cx, cy + rI + 40, { size: 24, weight: 700, align: 'center', alpha: s.fastP * g * dim * 0.9, color: C.green });
    /* 互锁箭头：Σ → θ（验证有效）与 θ → Σ（更强装备） */
    arrow(ctx, cx + rI + 26, cy + 60, cx + rO - 30, cy + 130, { p: s.linkP, color: C.green, alpha: 0.85 * s.linkP * g * dim, width: 3, head: 14 });
    txt(ctx, '固化', cx + rI + 78, cy + 70, { size: 19, alpha: s.linkP * g * dim * 0.8, color: C.green });
    arrow(ctx, cx - rO + 30, cy - 130, cx - rI - 26, cy - 60, { p: s.linkBack, color: C.fg, alpha: 0.8 * s.linkBack * g * dim, width: 3, head: 14 });
    txt(ctx, '更强装备', cx - rO + 60, cy - 150, { size: 19, alpha: s.linkBack * g * dim * 0.7 });
    /* 流动小点：内环快、外环慢 */
    const fa = this.t * 2.6, sa = this.t * 0.8;
    dot(ctx, cx + Math.cos(fa) * rI, cy + Math.sin(fa) * rI, 6, C.green, s.fastP * g * dim * 0.9);
    dot(ctx, cx + Math.cos(sa) * rO, cy + Math.sin(sa) * rO, 7, C.fg, s.slowP * g * dim * 0.8);
    /* 金句区（下方居中，强调态） */
    ruleLine(ctx, W / 2 - 300, 906, 600, s.golden1, C.fg, s.golden1 * g * 0.5, 2);
    txt(ctx, T.B.golden1, W / 2, 966, { size: 44, weight: 700, align: 'center', alpha: s.golden1 * g });
    txt(ctx, T.B.golden2, W / 2, 1032, { size: 44, weight: 700, align: 'center', alpha: s.golden2 * g, glow: C.yellow, glowBlur: 26 });
    txt(ctx, T.B.outro, W / 2, 1074, { size: 21, align: 'center', alpha: s.outro * g * 0.6 });
    txt(ctx, sceneText.global.paperSrc, 1860, 1012, { size: 20, align: 'right', alpha: s.srcA * g * 0.45 });
  }
}
/* ============================ 4. 导演层：时钟 / 画布 / 控制 / HUD ============================ */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const scenes = [new S0(), new S1(), new S2(), new S3(), new S4(), new S5(), new S6(), new S7()];
let cur = 0, paused = false, hud = true;

/* 画布：逻辑 1920x1080，按 devicePixelRatio 缩放，CSS 满窗 letterbox 居中 */
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.round(W * s) + 'px';
  canvas.style.height = Math.round(H * s) + 'px';
  canvas.width = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
}
window.addEventListener('resize', fit);
fit();

function goto(i) {
  cur = (i + scenes.length) % scenes.length;
  scenes[cur].reset();
}
function repaint() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  scenes[cur].render(ctx);
  if (hud) drawHUD();
}
function drawHUD() {
  const sc = scenes[cur], T = sceneText.hud;
  /* 顶栏：场景号 / 标题 / 计时 */
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, 44);
  ctx.restore();
  txt(ctx, sc.id + ' · ' + sc.title, 28, 30, { size: 21, alpha: 0.9 });
  txt(ctx, sc.t.toFixed(1) + 's / ' + sc.duration + 's', W - 28, 30, { size: 20, align: 'right', alpha: 0.75 });
  /* CUE 进度分段条 */
  const bx = 420, bw = 900, by = 18, bh = 8;
  let px = bx;
  sc.cues.forEach((q, i) => {
    const segW = (q.end - q.start) / sc.duration * bw;
    ctx.save();
    ctx.globalAlpha = 0.28; ctx.fillStyle = C.fg;
    ctx.fillRect(px, by, segW - 3, bh); ctx.restore();
    if (sc.t > q.start) {
      const f = Math.min(1, (sc.t - q.start) / (q.end - q.start));
      ctx.save();
      ctx.fillStyle = i % 2 ? C.yellow : C.blue;
      ctx.fillRect(px, by, (segW - 3) * f, bh); ctx.restore();
    }
    px += segW;
  });
  ctx.save();
  ctx.globalAlpha = 0.28; ctx.fillStyle = C.fg;
  ctx.fillRect(px, by, bx + bw - px, bh); ctx.restore();
  /* 当前 CUE 名 */
  const curCue = sc.cues.filter(q => sc.t >= q.start && sc.t < q.end).pop();
  if (curCue) txt(ctx, 'CUE_' + curCue.id + ' ' + curCue.label, bx, 46, { size: 17, alpha: 0.6 });
  /* 底栏：快捷键 / 下一场景提示 / 暂停提示 */
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, H - 36, W, 36);
  ctx.restore();
  txt(ctx, T.keys, 28, H - 12, { size: 19, alpha: 0.65 });
  if (sc.finished) {
    const p = 0.6 + 0.4 * Math.sin(performance.now() / 380);
    txt(ctx, T.next, W - 28, H - 12, { size: 20, align: 'right', alpha: 0.55 + p * 0.4, color: C.green });
  }
  if (paused) txt(ctx, T.paused, W / 2, H - 12, { size: 20, align: 'center', alpha: 0.9, color: C.yellow });
}

/* 主时钟：requestAnimationFrame，可暂停；单场景播完停在末帧 */
let lastMs = performance.now();
function loop(ms) {
  const dt = Math.min((ms - lastMs) / 1000, 0.05);
  lastMs = ms;
  if (!paused) scenes[cur].update(dt);
  repaint();
  requestAnimationFrame(loop);
}

/* 键盘控制：←/→ 场景 · 空格 暂停 · R 重放 · 1-8 直达 · H HUD */
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight') { e.preventDefault(); goto(cur + 1); }
  else if (k === 'ArrowLeft') { e.preventDefault(); goto(cur - 1); }
  else if (k === ' ') { e.preventDefault(); paused = !paused; }
  else if (k === 'r' || k === 'R') scenes[cur].reset();
  else if (k === 'h' || k === 'H') hud = !hud;
  else if (k >= '1' && k <= '8') goto(parseInt(k, 10) - 1);
});

/* 启动：S0 从头播放 */
goto(0);
requestAnimationFrame(loop);
</script>
