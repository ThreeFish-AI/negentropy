# 本集可执行参数的**唯一来源**（ISSUE-161：可执行参数不落散文文档，README 只引用配置）。
# 编排入口：uv run --no-project $T/scripts/pipeline.py --project $P <cmd>（$T/$W/$P/$V 见 vibe-video skill 的 references/PIPELINE.md）
#
# 只写**本集偏离**：机制常数（chars_per_min / lang / draft_scale / draft_jpeg_quality）
# 的默认值在 skill 仓 scripts/config.py，不要抄回这里。字段表见 skill 的
# references/PIPELINE.md，跑 `pipeline.py doctor` 可打印带来源标注的生效配置全表。

[episode]
slug = "jev-decision-model-video"

[narration]
# TODO：按本集选题与语速预算填写。口径提示——280 字/分是**含停顿的等效**口径，
# 裸按字数算会高估约 12% 的句容量，双口径门以 manifest 实测为准。
target_minutes = [13.0, 16.5]  # v2 清晰度修订扩窗（原 [13,15]，展开解释需更多字数）

[tts]
engine = "indextts"
# TODO：选定样本与风格。样本路径**工作区根相对**；ref_sha1 取 12 位（同 tts.py 口径），
# 用 `uv run --no-project $T/scripts/refs.py list` 查当前清单。
# ⚠️ 风格预设的 alpha 是在**特定选段**上标定的，换选段即失效（见 $V/refs.toml）。
ref = "voices/me-bright.wav"
ref_sha1 = "54b699cce97f"
style = "story"
# story 档（默认）＝段落演绎：同幕连续句按块合成、块间情绪由配音台本驱动。
# 台本（可选）：script/narration.cues.toml——写稿阶段产出，见 $T/references/VOICE-CLONING.md §4.5。
# 重制存量集（旧档 → story）须显式 --allow-voice-switch 并补写台本。

[archify]
html_dir = "docs/assets/architecture/agent-infra"
html_pattern = "jev--{slug}.html"
# 覆盖门硬值（本集偏离）：锚定率 / cue 密度 / 图型数的下限。上一档质量台阶要求高于
# 旧版实测（锚定 19.4%、2.4 cue/分、5 型）；本集按策划预算 ~60 cue / 14 张图 / 5 型。
min_anchor_ratio = 0.30
min_cues_per_minute = 3.0
min_diagram_types = 5
forbid_inset = true  # 本集三分法走全屏独占（storyboard 按此设计）；残留画中画即 FAIL
