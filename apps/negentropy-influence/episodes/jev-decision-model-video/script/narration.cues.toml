# ── 表演标点（≤15 处，只改标点）─────────────────────────────────

[say]
p0-01 = "暴雨夜，电视里的 AI 天气主播口若悬河，一条街一条街地报着雨量。"
p0-03 = "主播早就比人强了，自动化，却迟迟没来。"
p1-14 = "作者本人开的回马枪——讨人喜欢，和值得信任，是两个优化目标。"
p2-09 = "所以他报不出「紫色的雨」——行里，根本没这一格。"
p2-22 = "行尾的集中度读数，相当于他自报的把握，冲到 0.981，直接触发自动执行。"
p2-23 = "窗外大雨，单上填「晴」——格式对了，天气，没对。"
p3-25 = "两张卡加起来——1.19。"
p4-05 = "这一栏，由表格按固定公式自动算出——判读员的手，从来不碰。"
p5-01 = "现在——全片的转折点，来了。"
p5-06 = "他自己不报警——读数，还是那个读数。"
p5-20 = "这拨人实测下来……那颗骰子，它报到 82.9%。"
p6-02 = "停不停课、停不停航——从来，不由判读员决定。"
p6-25 = "官方首页的招牌数字——快 193.6 倍。"
p6-44 = "判读员不是更聪明的主播——而是，让判断变便宜的新岗位。"
p6-46 = "这期就到这里——我们，下期见。"
