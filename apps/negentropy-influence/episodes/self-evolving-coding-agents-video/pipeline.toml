# 《会写代码的 AI，开始给自己写代码》管线配置——pipeline.py 的默认参数源。
# 可执行参数只落此处，README 不再复制粘贴命令行（防 ISSUE-161 类漂移）；
# CLI 显式参数仍可覆盖本文件。

[episode]
slug  = "self-evolving-coding-agents-video"
title = "会写代码的 AI，开始给自己写代码"

[narration]
target_minutes = [12.0, 15.0]
chars_per_min  = 280

[tts]
# ⚠️ 本配置记录的是「复现已上线音频」的档：三集成片统一 passionate + me-1.wav。
# 摘要含 style 与 ref_sha1，改档 = 整集重合成（须 --allow-voice-switch 显式放行）。
# 升级 sunny-steady 属独立重录决策，登记于 series.json 的待升级项。
engine   = "indextts"
ref      = "pipeline/voices/me-1.wav"
ref_sha1 = "3ed0d9d60d4b"
style    = "passionate"
lang     = "ZH"

[render]
draft_scale        = 0.5
draft_jpeg_quality = 60
