[say] # 表演标点：拖停顿…/抛高！/关键短语前顿一下，只改标点
p0-03 = "二百四十七行，命中一处。第一百三十三行，兼容性字段的示例里，一个单词——Designed。"
p0-04 = "签名的 sign，藏在一个普通单词的肚子里。这就是……全部。"
p0-07 = "留白的代价已经到账：有安全团队扫了近四千个技能，确认七十六个……恶意。"
p0-09 = "但港口没有海关。货怎么签名、怎么分发、怎么管版本——三张欠条，一张没兑。"
p1-07 = "听起来顺理成章？这份提案在仓库里，躺了六个多月，至今没有合并。"
p1-13 = "只有摘要校验能当场抓住这种——「阴阳舱单」。我们搭了个玩具实测：关掉校验，同批安装出两个版本、零报错；打开校验，失配，整批打回。"
p2-08 = "社区在评论区里，手工重造了……三年前的答案。"
p2-12 = "还有个人泼了盆冷水，泼得极准：技能一旦被贴进聊天窗口，舱单这条链就消失了，只剩随包旅行的内容——签名，保护不了离开港口的货。"
p3-02 = "规范的六个字段里，根本没有版本号。这是明文决策：维护者说，版本化属于分发层——一个，还不存在的层。"
p3-07 = "对照组是一家云厂商的技能库：自动化发版，零点一点一到零点一点八，每版附带舱单和压缩包。同一套标准……两个物种。"
p3-13 = "有人总结得最狠：技能就是指令，跟所有软件包一样是指令——只不过一个用散文写，一个用代码写。凭什么，散文就不需要版本管理？"
p4-07 = "上游偷换货，从静默事件变成——可检测事件。这半场革命，打得漂亮。"
p4-08 = "但它诚实地写明：摘要没有签名，跟内容放在同一台服务器上，网关可以两头一起改——摘要匹配，不是安全边界。"
p5-09 = "同一个指令，两条通道，一条畅通一条设卡——防线不在格式里，在各家客户端的，实现选择里。"
p6-08 = "差别只有一个：他们最后都长出了带强制力的中心设施，这里的答案，还压在提案队列里。"
p6-09 = "港口还在营业，四十六家航运公司进进出出。只是每一箱货……都在裸运。"
