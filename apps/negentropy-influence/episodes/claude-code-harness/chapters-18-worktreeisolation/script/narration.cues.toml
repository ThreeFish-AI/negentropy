p0-01 = "这是同一个目录里，挤着的几个队友：各干各的活，改的，却是同一份代码。"
p0-04 = "任务板管了谁干什么，收件箱管了怎么说——在哪干？没人管。"
p0-07 = "更要紧的是——拆房那一步，藏着全片最值得学的，一道守卫。"
p1-02 = "它是同一本账上，同时铺开的另一份工作目录——<行|HANG2>话，叫工作树。"
p2-03 = "两位队友各领一间，都要动那个配置文件——这回，谁也，踩不<着|ZHAO2>谁。"
p3-02 = "第二条，要线连着上游——远处对着的那本账——才<数|SHU3>得<着|ZHAO2>！第一条，不看这条前提。"
p3-03 = "有一样不是零——默认拒绝！这是三个出口里的，第一个。"
p3-06 = "绕开守卫强拆呢？目录没了，文件无声蒸发，线，也连坐删掉。"
p3-07 = "一句话教训：收尾的保护，比创建，更值得学。"
p4-06 = "最后把边界说死：这堵墙，挡互踩，不挡越狱！"
p4-08 = "拿它关不可信的代码，是把它当成它不是的东西——施工面，不是笼子！"
p5-03 = "最该带走的，是那道默认拒绝：护住收尾，比创建，更要紧。"
