[say]
p0-01 = "这是一场合体后的总点验：十八般机制都到齐，芯子，还是那四句。"
p0-02 = "哪四句？调模型、看响应里有没有工具调用、有就执行，结果回填。"
p0-05 = "但合在一起怎么跑？每一件，都得在循环上，有一个固定的挂点。"
p1-08 = "限流，就退一步再试；超载，换备用；超长，提额续写——实在太长，现场，再压一道。"
p2-03 = "有，接着走执行；没有，本轮，就地收尾。"
p2-09 = "一圈走完，每一站都是往循环周围加东西——周围变厚，循环，没变。"
p3-06 = "拆解过 Claude Code 源码的同学们应该知道：不认收尾字段，「本轮说完了」的记号——只认，调用块。"
p3-12 = "一句输入，三圈走廊，每步都有人接住。"
p4-05 = "要结论，用一次性子代理，只回摘要；要并肩，拉持久队友，空闲，自己领活。"
p4-08 = "从八件长到十四、十八，再到二十七，机制每添一层，家什跟着添。"
p4-09 = "本地原型实测：连上新服务、沿用旧名册，调用，直接报错——不认识这个工具。"
p5-02 = "一句话收束：机制很多，循环，一个。"
p5-06 = "终点回头望，最初那声心跳，一路，没停。"
p5-07 = "没有下期了。工具还会再长，循环还是那一个。"
