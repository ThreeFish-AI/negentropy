[say]
p0-01 = "这是一张，注定写满的草稿纸——写满那一刻，整个请求，直接被拒收。"
p0-05 = "能用，但，最贵：再请模型干一次活，必然丢细节。"
p0-06 = "丢成什么样？「缩进用制表符」，压成——「用户有代码风格偏好」。"
p0-07 = "解法，是四步管线：便宜的先跑，贵的后跑。"
p0-08 = "动手之前，先立一条，红线。"
p1-01 = "红线，是硬规矩：一次工具调用，必须，跟着它的结果。"
p1-08 = "再加五千，超线——八万，先存盘、留两千预览；掉回，约十二万七。停手。"
p2-07 = "大件完整存盘，一份，变零份；十一处占位，成死字。"
p2-09 = "备份，永远排在删除前面——顺序，即数据生死。"
p3-06 = "拆掉未读保护，实测：下一轮，原样再调一次——白付，第二遍。"
p3-09 = "折叠两条、保留三条、豁免两条、预览一条——六万三，压到，一万六。"
p3-10 = "到这为止，一步调用，都没花；最贵的那步——压轴。"
p4-02 = "字符还超线，才轮到第四步，全量摘要——唯一，花调用的一步。"
p4-09 = "阈值，按精确额度：窗口，减输出上限、留一万三缓冲；连败三次——熔断。"
p5-01 = "一句话收束：便宜的，先跑；贵的，后跑。"
p5-04 = "只是摘要，有损；新开一场对话，连摘要，都不剩——什么都不记得。"
