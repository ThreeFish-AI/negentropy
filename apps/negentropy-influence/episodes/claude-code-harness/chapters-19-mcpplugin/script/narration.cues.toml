# story 档配音台本（与 narration.md 同产，2026-11-02）
# 导演规则：按故事弧分块（铺垫→机制解构→走查→冲突峰值→生产对照→收束），每块 ≤3 句、≤90 字；
# 块间换情绪——全片一种情绪就是「朗读感」的根因。say 只改标点、去标点后须与正文全等。
# 本集张力曲线：P0 老办法痛点认领（melancholic）→ P1 三步机制平实走步与硬线 punch →
# P2 走查轻快与零行成就（happy）→ P3 消融峰值（afraid 峰在旧快照病灶 p3-06）→
# P4 生产对照沉稳降压与原则压轴 → P5 收束平收与终章预告。

