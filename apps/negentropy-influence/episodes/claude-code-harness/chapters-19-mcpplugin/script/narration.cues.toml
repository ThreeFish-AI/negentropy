[say]
p0-01 = "这是接工具的老办法：外面的工具千千万——接一个，重写一套。"
p0-02 = "想接个工单系统？手写定义、参数格式、调用代码——一整套！"
p0-05 = "接得越多，写得越多——这条路，养不起千千万。"
p0-08 = "两半怎么分、工具怎么不写代码就进门？今天，拆开看。"
p1-05 = "两个服务都有同名的工具？挂牌之后，谁也，顶不掉谁。"
p1-07 = "教学版还画了硬线：名字清理完仍撞名，直接报错；全名超六十四字符，拒收！"
p2-02 = "挂牌、进池、随池交给模型——一口气，走完！"
p2-06 = "这条链走完，主程序没写过一<行|HANG2>接入代码。"
p2-07 = "斜杠圆点进不了白名单，一律翻成下划线——实测，在案。"
p3-01 = "别小看「每轮组装」：工具池是活的，不是一份，固定清单。"
p3-05 = "池子回得，冷冰冰：不认识的工具。"
p3-08 = "两条实测，双双坐实：不重建，调不到；重建，立刻恢复！"
p3-10 = "教训一句话：池是动态的，依赖它的缓存，必须，随它失效！"
p4-02 = "拆解过 Claude Code 源码的同学们应该知道：光是把工具连过来的通道——传输——就有，六种。"
p4-05 = "更值得记的是权限：服务自称「只读」——这<行|HANG2>字，不算数！"
p4-07 = "教学版名单四条：三件只读放行，那件会动手的，就是触发部署——每次都问！"
p5-01 = "一句话收束：能力不靠改代码，靠发现、命名、组装，接进来。"
p5-03 = "机制都到齐了——可单件都好，不等于，整机就转。"
