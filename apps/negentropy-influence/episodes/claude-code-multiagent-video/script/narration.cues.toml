[say]
p0-01 = "这是一栋通宵亮灯的小楼……里面每一位师傅，手艺都是顶尖的，却，谁也记不住昨天。"
p0-07 = "活多到要一班组人的时候——计划，放在，谁手里？"
p1-25 = "守卫挡得住明抢，挡不住，同一瞬间。"
p3-17 = "口里躺着关机请求，立即回执退出——指令，永远，排在发现的活前面。"
p4-15 = "有改动，拒拆——这五个字，是留给未来自己的，救命索。"
p5-12 = "图新鲜，就不吃缓存——这是这一段，亲手付的账。"
p6-11 = "看的是回答里，实际出现没出现工具调用块——看单子，不看嘴。"
p6-27 = "天快亮了，回到开场那个问题——计划，放在，谁手里？"
p6-31 = "机制很多，循环一个……这栋楼教了一整夜的事，就这一句。"
