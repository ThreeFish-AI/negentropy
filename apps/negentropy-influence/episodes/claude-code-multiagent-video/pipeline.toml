# 本集可执行参数的**唯一来源**（ISSUE-161：可执行参数不落散文文档，README 只引用配置）。
# 编排入口：uv run --no-project $T/scripts/pipeline.py --project $P <cmd>（$T/$W/$P/$V 见 to-video skill 的 references/PIPELINE.md）
#
# 只写**本集偏离**：机制常数（chars_per_min / lang / draft_scale / draft_jpeg_quality）
# 的默认值在 skill 仓 scripts/config.py，不要抄回这里。字段表见 skill 的
# references/PIPELINE.md，跑 `pipeline.py doctor` 可打印带来源标注的生效配置全表。

[episode]
slug = "claude-code-multiagent-video"

[narration]
# 语速锚：edge（zh-CN-YunxiNeural +4%）实测口径 ≈278 字/分
# （ep3 重制 edge 草声实测：3688 字 → 13.25 分）；本集 edge 即终声，
# 首轮 tts 后按 RSI-021 复核，偏差 >3% 回写本值。
target_minutes = [13.0, 14.6]
chars_per_min = 278

[tts]
# 两档策略（RSI-034）：本集 edge 即终声（完整交付 edge 版 v1）；
# 整集评审通过后由用户显式触发用 IndexTTS-2.5 + 本人声音重配（references/07 §重配）。
# ⚠ edge 为终声时**不得挂 style 终声档锚**——挂了实测门即跳过（PIPELINE.md 字段表）。
engine = "edge"
# ⚠ 本集 rate 偏差（2026-10-03 实测定档）：zh-CN-YunxiNeural @ +4% 实测 15.7 分超窗 1.1 分，
# 提速到 +12% + timing.json 收紧（gap 0.32→0.2 / scene 0.9→0.6 / tail 2.0→1.6）后实测 14.3 分落窗。
# pipeline.py tts 不透传 rate——重跑须用工程内薄包装（.engine 签名含 rate，护栏会拦静默降速）：
#   cd $P && uv run --no-project --with edge-tts --with mutagen scripts/tts.py \
#     --engine edge --narration-lang zh --rate +12% --allow-voice-switch
# 重配三步（届时执行）：① engine 改 "indextts" + 补下方 ref/ref_sha1 + style = "story"；
# ② `pipeline.py tts --allow-voice-switch`；③ 重走 render → qa → check → captions → render --final。
# TODO（重配前补齐，非建集前置）：样本路径**工作区根相对**；ref_sha1 取 12 位
# （同 tts.py 口径），用 `uv run --no-project $T/scripts/refs.py list` 查当前清单。
# ⚠ 风格预设的 alpha 是在**特定选段**上标定的，换选段即失效（见 $V/refs.toml）。
#ref = "voices/me-bright.wav"
#ref_sha1 = "TODOTODOTODO"
# 台本 script/narration.cues.toml 已随 Stage ⑤ 后预置（story 块/情绪弧），重配零前置。

[archify]
# 源图 = archify 3.0 产物（无 guided-views 模块，录制器不可直录）；本集用
# scripts/patch-archify-html.py 从 docs 原件拷贝并注入精简 guidedViews 兼容层
# （E1 范式，RSI-038），落本集 html/——docs 原件（SSOT）不动。重跑注入器即幂等重建。
# 首录后须逐图人工审计 sidecar type（嗅探 14/67 不可靠，ISSUE-201 ③）。
html_dir = "apps/negentropy-influence/episodes/claude-code-multiagent-video/video/public/archify/html"
html_pattern = "{slug}.html"
min_anchor_ratio = 0.30
min_cues_per_minute = 3.0
min_diagram_types = 5
forbid_inset = true  # 全屏独占（storyboard 按此设计）；残留画中画即 FAIL
# 终幕 6-D..6-J（p6-10..29，20 句）为 storyboard 刻意设计的装置镜段（判据卡/五增量
# 合口/数字卡/收官断言/边界护栏/天亮回收），零 archify 锚；豁免 P6 的连续无锚 run
# 计数（openviking 先例）。P6 分幕锚定率不受豁免影响仍过（5/34 ≥ 下限）。
exempt_scenes = ["P6"]
