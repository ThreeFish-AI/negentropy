# 《上线之后，AI 才开始上学》管线配置——pipeline.py 的默认参数源。
# 可执行参数只落此处，README 不再复制粘贴命令行（防 ISSUE-161 类漂移）；
# CLI 显式参数仍可覆盖本文件。

[episode]
slug  = "experience-era-agents-video"

[narration]
# 时长预算门（check_script.py 两口径都查：字数估算 + manifest 实测）
target_minutes = [13.0, 14.2]

[tts]
engine   = "indextts"
ref      = "pipeline/voices/me-bright.wav"   # 子项目根相对（见 pipeline/scripts/paths.py）
ref_sha1 = "54b699cce97f"                          # --expect-ref-sha1 硬校验（12 位，同 tts.py 口径）
style    = "sunny-steady"   # 2026-08 重录决策：成片档 beams=3（首集全片换 sunny-steady）
# 两遍法：草稿遍用 CLI 覆写 --style sunny（快 3.4 倍），定稿遍回到本配置默认值。
