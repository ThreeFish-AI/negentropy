[say] # 表演标点：拖停顿…/抛高！/关键短语前顿一下，只改标点
p0-03 = "一年后的结果更反常：OpenAI接了，Google接了，微软接了，Cursor也接了。"
p0-04 = "四十六家客户端，几乎凑齐了AI编程工具的——整张牌桌。"
p0-07 = "它凭什么，让所有竞争对手低头？"
p1-12 = "不是没做完，是刻意不做。记住这三处留白——后面全是戏。"
p2-07 = "这就是贯穿整个标准的核心设计，名字很直白，叫——渐进披露。"
p2-10 = "差了快十七倍。当然这是玩具规模——但方向，不会骗人。"
p3-04 = "官方指南管这种叫静默退化：技能没坏，只是……死了。"
p3-11 = "毕竟调度员只看一眼。你写下的每个字，都在替你参加这场，一秒定生死的面试。"
p4-11 = "唯一的确认门，是Gemini自己决定设的。标准说「建议考虑」，它，当了真。"
p5-05 = "同一个任务，两家助手行为不同，而且——谁都没报错。身份这种东西，不锚在规范里，就锚在扫描顺序的偶然里。"
p6-04 = "管得越少，越多人肯用——这是格式赢得生态战的算法。代价，都记在了留白处。"
p6-09 = "这个格式多半也会走同一条路：先成为事实，再补上条文。"
p6-12 = "一个文件夹，一份说明文件，一行货签——标准只做这三件事，就把整张牌桌，拉到了同一张图纸上。"
