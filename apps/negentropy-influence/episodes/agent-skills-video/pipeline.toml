# 本集可执行参数的**唯一来源**（ISSUE-161：可执行参数不落散文文档，README 只引用配置）。
# 编排入口：uv run --no-project $T/scripts/pipeline.py --project $P <cmd>（$T/$W/$P/$V 见 to-video skill 的 references/PIPELINE.md）
#
# 只写**本集偏离**：机制常数（chars_per_min / lang / draft_scale / draft_jpeg_quality）
# 的默认值在 skill 仓 scripts/config.py，不要抄回这里。字段表见 skill 的
# references/PIPELINE.md，跑 `pipeline.py doctor` 可打印带来源标注的生效配置全表。

[episode]
slug = "agent-skills-video"

[narration]
# 时长窗对齐系列惯例（旧 v2 成片 13:03 / E3 13:57；story 档 254 字/分 → 预算 ~3430 字）。
target_minutes = [12.5, 14.5]

[archify]
# 230 精读伴生双图（C 型直通承接）。源图 = archify 3.0 产物（无 guided-views 模块，
# 录制器不可直录）；本集用 .temp/e1-patch-archify-html.py 从 docs 原件拷贝并注入
# 精简 guidedViews 兼容层（组合 3.0 原生 focus.set/view.reveal/view.centerAt），
# 落本集 html/——docs 原件（SSOT）不动。重跑注入器即幂等重建。
html_dir = "apps/negentropy-influence/episodes/agent-skills-video/video/public/archify/html"
html_pattern = "{slug}.html"
forbid_inset = true
min_diagrams = 2
min_cues = 12
min_cues_per_minute = 0.9
min_diagram_types = 2
min_anchor_ratio = 0.10

[tts]
engine = "indextts"
# TODO：选定样本与风格。样本路径**工作区根相对**；ref_sha1 取 12 位（同 tts.py 口径），
# 用 `uv run --no-project $T/scripts/refs.py list` 查当前清单。
# ⚠️ 风格预设的 alpha 是在**特定选段**上标定的，换选段即失效（见 $V/refs.toml）。
ref = "voices/me-bright.wav"
ref_sha1 = "54b699cce97f"
style = "story"
# story 档（默认）＝段落演绎：同幕连续句按块合成、块间情绪由配音台本驱动。
# 台本（可选）：script/narration.cues.toml——写稿阶段产出，见 $T/references/VOICE-CLONING.md §4.5。
# 重制存量集（旧档 → story）须显式 --allow-voice-switch 并补写台本。
