# 本集可执行参数的**唯一来源**（ISSUE-161：可执行参数不落散文文档，README 只引用配置）。
# 编排入口：uv run --no-project $T/scripts/pipeline.py --project $P <cmd>（$T/$W/$P/$V 见 vibe-video skill 的 references/PIPELINE.md）
#
# 只写**本集偏离**：机制常数（chars_per_min / lang / draft_scale / draft_jpeg_quality）
# 的默认值在 skill 仓 scripts/config.py，不要抄回这里。字段表见 skill 的
# references/PIPELINE.md，跑 `pipeline.py doctor` 可打印带来源标注的生效配置全表。

[episode]
slug = "agent-skills-video"

[narration]
# 210 重学版换代重制（2026-10-06）：目标窗 11.5–13.5 分（210 内容量评估，较旧版 13:07 略收）。
# chars_per_min 显式覆写 280（含停顿等效口径）：本集 edge 草声一档到底（用户拍板），
# [tts].style=story 锚点的 254 系克隆档整集实测口径、对 edge 不适用——config.resolve
# 显式 toml 恒优先；首轮 TTS 后按 RSI-021 以 manifest 实测复算，偏差>3% 回写本校准值。
target_minutes = [11.5, 13.5]
chars_per_min = 280

[archify]
# 210 伴生双图（C 型直通承接，GL 原生章集镜像 + P4 生态补章 ge-eco，见 views/*.json）。
# 源图 = archify 3.0 产物（无 guided-views 模块，录制器不可直录）；本集用
# scripts/patch-archify-html.py 从 docs 原件拷贝并注入精简兼容层（组合原生
# focus.set/view.reveal/view.centerAt），落本集 html/——docs 原件（SSOT）不动；
# 拷贝件中原件自带的 GL 章容器剥除，views/*.json 为录制章集唯一事实源。
html_dir = "apps/negentropy-influence/episodes/agent-skills-video/video/public/archify/html"
html_pattern = "{slug}.html"
forbid_inset = true
# 覆盖门分两组登记（成片实测：12 cue / ≈0.98 cue 每分 / 锚定 8.5% / 图型 2 种
# （workflow+architecture）/ 9 章全启用）：
# ① cue 派生门＝实测 −15~20% 回填（min_anchor_ratio 0.07 vs 实测 8.5%；min_cues 10 vs
#    实测 12；min_cues_per_minute 0.8 vs 实测 0.98），吸收 QA 轮 cue 微调余量；
# ② 图数/图型门＝保守地板（min_diagrams=2 与双图持平为本集结构事实；min_diagram_types=1
#    较实测 2 种留一档余量——v13 旧集教训：门值贴实测零余量属结构性失真）。
# exempt_scenes：P0 钩子幕 / P6 收束幕无 archify 锚为设计口径（RSI-039 首镜定式 +
# 〔M-001〕终态回扣），按门要求显式登记；max_unanchored_run 20（实测最长 18，
# p3-04..p4-03 为 X1 消融/16.9× 标尺/预算门等装置密集段，句句有非字幕可见元素，
# ISSUE-188 覆盖自检按镜目检保证）。
exempt_scenes = ["P0", "P6"]
min_diagrams = 2
min_cues = 10
min_cues_per_minute = 0.8
min_diagram_types = 1
min_anchor_ratio = 0.07
max_unanchored_run = 20

[tts]
# 两档策略（RSI-034）：制作期 edge 草声（免费、秒级、需联网、免样本）；
# 整集评审通过后由用户显式触发用 IndexTTS-2.5 + 本人声音重配（references/07 §重配）。
engine = "edge"
# 终声档锚点：edge 期间不参与合成，仅作预算门估算口径（story=254 字/分）
# 与重配预置；重配时把 engine 改 "indextts" 并补下方两项即生效。
style = "story"
# TODO（重配前补齐，非建集前置）：样本路径**工作区根相对**；ref_sha1 取 12 位
# （同 tts.py 口径），用 `uv run --no-project $T/scripts/refs.py list` 查当前清单。
# ⚠️ 风格预设的 alpha 是在**特定选段**上标定的，换选段即失效（见 $V/refs.toml）。
#ref = "voices/me-bright.wav"
#ref_sha1 = "TODOTODOTODO"
# story 档（默认）＝段落演绎：同幕连续句按块合成、块间情绪由配音台本驱动。
# 台本（可选）：script/narration.cues.toml——写稿阶段产出，见 $T/references/VOICE-CLONING.md §4.5。
# 重配（引擎/风格/样本任一变化＝整集重录）须显式 --allow-voice-switch；首次上 story 补写台本。
# 实跑（非 --plan）另须 --final-voice：本人显式点名的具名授权（RSI-040 人为触发，
# 见 references/07-tts-voice.md）——agent 不得主动建议升档，其余一律 edge 草声。
