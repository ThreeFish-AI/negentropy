# 本集可执行参数的**唯一来源**（ISSUE-161：可执行参数不落散文文档，README 只引用配置）。
# 编排入口：uv run --no-project $T/scripts/pipeline.py --project $P <cmd>（$T/$W/$P/$V 见 to-video skill 的 references/PIPELINE.md）
#
# 只写**本集偏离**：机制常数（chars_per_min / lang / draft_scale / draft_jpeg_quality）
# 的默认值在 skill 仓 scripts/config.py，不要抄回这里。字段表见 skill 的
# references/PIPELINE.md，跑 `pipeline.py doctor` 可打印带来源标注的生效配置全表。

[episode]
slug = "context-layer-video"

[narration]
# TODO：按本集选题与语速预算填写。口径提示——280 字/分是**含停顿的等效**口径，
# 裸按字数算会高估约 12% 的句容量，双口径门以 manifest 实测为准。
target_minutes = [13.0, 14.9]

[tts]
engine = "indextts"
# TODO：选定样本与风格。样本路径**工作区根相对**；ref_sha1 取 12 位（同 tts.py 口径），
# 用 `uv run --no-project $T/scripts/refs.py list` 查当前清单。
# ⚠️ 风格预设的 alpha 是在**特定选段**上标定的，换选段即失效（见 $V/refs.toml）。
ref = "voices/me-bright.wav"
ref_sha1 = "54b699cce97f"
style = "story"
# story 档（默认）＝段落演绎：同幕连续句按块合成、块间情绪由配音台本驱动。
# 台本（可选）：script/narration.cues.toml——写稿阶段产出，见 $T/references/VOICE-CLONING.md §4.5。
# 重制存量集（旧档 → story）须显式 --allow-voice-switch 并补写台本。

[archify]
# 13 图（6 张 blueprint-- 前缀走 pattern，7 张 context-layer-- 前缀走 overrides）。
# 阈值按分镜设计值（69 cue/36.5% 锚定/4.8 密度）留 10–15% 余量定稿；录制后以实测微调。
html_dir = "docs/assets/architecture/cognitive-context"
# pattern 已无匹配对象（13 图全部显式映射，slug 与视图文件名一致）
html_pattern = "context-layer--{slug}.html"
min_diagrams = 13
min_cues = 62
min_anchor_ratio = 0.32
min_chapter_ratio = 0.45
min_scene_anchor_ratio = 0.06
max_unanchored_run = 21
min_cues_per_minute = 4.0
min_diagram_types = 4
forbid_inset = true

[archify.html_overrides]
"blueprint--architecture" = "context-layer-blueprint--architecture.html"
"blueprint--dual-track-roadmap" = "context-layer-blueprint--dual-track-roadmap.html"
"blueprint--industry-landscape" = "context-layer-blueprint--industry-landscape.html"
"blueprint--layer-mechanism-map" = "context-layer-blueprint--layer-mechanism-map.html"
"blueprint--mcp-threat-model" = "context-layer-blueprint--mcp-threat-model.html"
"blueprint--object-lifecycle" = "context-layer-blueprint--object-lifecycle.html"
failure-map = "context-layer--failure-map.html"
five-sources = "context-layer--five-sources.html"
lifecycle = "context-layer--lifecycle.html"
assembly-economics = "context-layer--assembly-economics.html"
injection-points = "context-layer--injection-points.html"
runtime-layering = "context-layer--runtime-layering.html"
evolution-levers = "context-layer--evolution-levers.html"
