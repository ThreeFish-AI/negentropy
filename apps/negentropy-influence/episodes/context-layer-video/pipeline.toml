# 本集可执行参数的**唯一来源**（ISSUE-161：可执行参数不落散文文档，README 只引用配置）。
# 编排入口：uv run --no-project $T/scripts/pipeline.py --project $P <cmd>（$T/$W/$P/$V 见 vibe-video skill 的 references/PIPELINE.md）
#
# 只写**本集偏离**：机制常数（chars_per_min / lang / draft_scale / draft_jpeg_quality）
# 的默认值在 skill 仓 scripts/config.py，不要抄回这里。字段表见 skill 的
# references/PIPELINE.md，跑 `pipeline.py doctor` 可打印带来源标注的生效配置全表。

[episode]
slug = "context-layer-video"

[narration]
# 口径提示——280 字/分是**含停顿的等效**口径，
# 裸按字数算会高估约 12% 的句容量，双口径门以 manifest 实测为准。
# v3 九幕 289 句实测 26.5 分钟（含时距）；窗口上沿 27.0 留 3 分钟余量到用户 30 分钟硬顶。
target_minutes = [21.0, 27.0]

[tts]
# v3（2026-10-15 用户指定）：edge 预置音色草渲——zh 缺省 zh-CN-YunxiNeural（+4%），
# 秒级免样本。无 style 锚点＝实测时长门生效（edge 终声集口径，见 07-tts-voice.md）；
# 可用克隆样本清单见工作区 voices/refs.toml（升档 indextts 属人工显式授权闸，不在本轮）。
engine = "edge"

[archify]
# v3 图集 12 张（重录 4 / 新录 2 / 退役 4——含本片未引用的 industry-landscape / 存活 5，蓝图三面重铸配套）。
# 源图 = archify 3.0 产物（无 guided-views 模块，录制器不可直录）；本集用
# scripts/patch-archify-html.py 从 docs 原件拷贝并注入精简兼容层，落本集 html/——
# docs 原件（SSOT）不动；views/*.json 为录制章集唯一事实源。
# 12 图全部走 [archify.html_overrides] 显式钉 slug（html_pattern 仅作兜底，当前无匹配对象）：
# 录制器按源图名「--」末段推导 slug，blueprint--* 长 slug 会被截成 architecture 等错位名，
# overrides 键即本集 slug、值为 html/ 下桥接副本文件名。
html_dir = "apps/negentropy-influence/episodes/context-layer-video/video/public/archify/html"
html_pattern = "context-layer--{slug}.html"
# 门限按 v3 分镜设计值（~78 cue / ~24 min ≈ 3.25 每分）留 8% 余量定稿；录制后以实测微调。
min_diagrams = 12
min_cues = 72
min_anchor_ratio = 0.32
min_chapter_ratio = 0.45
min_scene_anchor_ratio = 0.06
max_unanchored_run = 21
min_cues_per_minute = 3.0
min_diagram_types = 4
forbid_inset = true

[archify.html_overrides]
"blueprint--architecture" = "blueprint--architecture.html"
"blueprint--first-class-object" = "blueprint--first-class-object.html"
"blueprint--layer-mechanism-map" = "blueprint--layer-mechanism-map.html"
"blueprint--mcp-threat-model" = "blueprint--mcp-threat-model.html"
"blueprint--object-lifecycle" = "blueprint--object-lifecycle.html"
failure-map = "failure-map.html"
lifecycle = "lifecycle.html"
assembly-economics = "assembly-economics.html"
injection-points = "injection-points.html"
evolution-levers = "evolution-levers.html"
read-pipeline = "read-pipeline.html"
ingest-pipeline = "ingest-pipeline.html"
