p4-12 = "从第一页改一个字？后面整叠，全按新页算。"
p5-10 = "三句进来，只入库一条——这不是效率低，是设计如此。"
p6-02 = "跑一整天不崩，靠便宜的先跑、贵的殿后；第二天还记得你——靠目录常驻，正文按需。"
p6-23 = "一张草稿纸，一本卡片册。"
