# 把本工程钉成它自己的 pnpm workspace 根——这是本文件存在的首要理由。
# pnpm 12 起仅靠 `--ignore-workspace` 不够：pnpm 仍会沿 packageManager 向上锚定到仓库根，
# 用本工程的解析结果覆写根 pnpm-lock.yaml（overrides 全丢）且当场不报错。见 ISSUE-175。
packages: []
# pnpm 12 的构建脚本许可（package.json 的 pnpm.onlyBuiltDependencies 已不被读取，
# 静默忽略会使安装以 ERR_PNPM_IGNORED_BUILDS 中断、node_modules 半残）。键名与取值
# 与 `pnpm approve-builds esbuild --yes` 实际写入的形态逐字一致——勿改回旧键名。
allowBuilds:
  esbuild: true
# 传递依赖的安全补丁地板（本工程无直接依赖漂移，故只落在 override 层）。
# GHSA-2883-xcg3-v3hh (high)：js-yaml < 4.3.2 的 maxTotalMergeKeys 对空 merge 源不限流
# 致 CPU 耗尽。本工程经 cosmiconfig@8.3.6 传递引入，父包声明 ^4.1.0；限 <5 避免 major
# 跳跃——无上界时 pnpm 会解到 5.x。与仓库根 pnpm-workspace.yaml 同口径。
minimumReleaseAgeExclude:
  - '@remotion/bundler@4.0.532'
  - '@remotion/canvas@4.0.532'
  - '@remotion/captions@4.0.532'
  - '@remotion/cli@4.0.532'
  - '@remotion/codemods@4.0.532'
  - '@remotion/compositor-darwin-arm64@4.0.532'
  - '@remotion/compositor-darwin-x64@4.0.532'
  - '@remotion/compositor-linux-arm64-gnu@4.0.532'
  - '@remotion/compositor-linux-arm64-musl@4.0.532'
  - '@remotion/compositor-linux-x64-gnu@4.0.532'
  - '@remotion/compositor-linux-x64-musl@4.0.532'
  - '@remotion/compositor-win32-x64-msvc@4.0.532'
  - '@remotion/elevenlabs@4.0.532'
  - '@remotion/layout-utils@4.0.532'
  - '@remotion/licensing@4.0.532'
  - '@remotion/media-parser@4.0.532'
  - '@remotion/media-utils@4.0.532'
  - '@remotion/media@4.0.532'
  - '@remotion/openai-whisper@4.0.532'
  - '@remotion/paths@4.0.532'
  - '@remotion/player@4.0.532'
  - '@remotion/renderer@4.0.532'
  - '@remotion/streaming@4.0.532'
  - '@remotion/studio-protocol@4.0.532'
  - '@remotion/studio-server@4.0.532'
  - '@remotion/studio-shared@4.0.532'
  - '@remotion/studio@4.0.532'
  - '@remotion/timeline-utils@4.0.532'
  - '@remotion/web-renderer@4.0.532'
  - '@remotion/zod-types@4.0.532'
  - remotion@4.0.532
overrides:
  js-yaml: '>=4.3.2 <5.0.0'
