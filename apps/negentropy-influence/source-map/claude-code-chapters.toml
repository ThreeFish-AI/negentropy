# 系列信源地图（机器可读 SSOT）——《Claude Code 的 20 个核心机制》的 章→集 归属唯一登记处。
# 人读版：claude-code-chapters.md；与 series.json（机器）/ series.md（人读）同一配对纪律。
#
# ── 系列定位 ────────────────────────────────────────────────────────────────
# 站点 20 章 1:1 拆集（2026-10-29 用户决策）：每章一集、每集约 5 分钟，
# 与《Claude Code Harness Engineering》（claude-code-explained，5 集制）并行；
# 旧系列待本系列建成后退役。修订分叉叙事（站点 20 章版 ↔ main 17 章整合版）
# 见旧地图 source-map/claude-code-explained.toml 头注——本地图不重述，只登记
# 本系列自己的钉选决策。
#
# ── 双钉 ────────────────────────────────────────────────────────────────────
# 逐集开工复核钉选（文案轮 2026-10-31 全量完成 ep3–ep20）。翻钉 main 的六集：
# ep1 判据之争记忆点「看内容块别信停止标记」依赖 main 修正后的写法；
# ep2 站点轨 s02 判据仍写 stop_reason（同 ep1 口径硬伤）+ main 新增「为什么还要
#   加工具」接口论证一节；
# ep3/ep4 站点轨 s03/s04 判据/括注同款口径硬伤（stop_reason 判据、强制续跑归属
#   说反），且 main 各有正源级增量（s03 词边界正则+测试点 5；s04 Stop 续跑写进
#   教学正文）；
# ep6 main s06 为本集叙事正源级修订（详见该集 gl-notes 附录 B.1）；
# ep8/ep9 main s08/s09 压缩管线与记忆机制有正源级更新（冻结正文 §3.7/§4.5 所引
#   CC 实现对照的现行口径）；
# ep19 main s14_mcp_plugin 为 MCP 章现行扩写版。
# 维持站点轨的十二集：ep5/ep7（main 仅注释中文化与空输入守卫，站点轨独有「深入
# CC 源码」附录族是【三】级断言正源）、ep10/ep11（main 无独立章，深潜只在站点轨）、
# ep12–ep18（改号不改内容或系列决策单章成集，main 对照经 {slug}m-* 登记）、
# ep20（综合章按 20 章版集制骨架收束）。
# 各集翻钉/维持的完整证据链：各集 research/gl-notes.md 附录 B.1；站点轨独有
# 附录一律经 {slug}f-* 条目补登（字节归档随集），断言恒【三】级。
# ⚠ 已知偏差：ep19 翻钉 main 后目录名跨轨不共用（章节表 id=s19_mcp_plugin 为站点
# 轨目录名，main 轨目录为 s14_mcp_plugin）——sync 按章节表 id 机械拼 URL 会 404
# 报 FAIL 2，属机制表达力缺口非台账错误：本集 s19-readme/-code 已按 main 真实
# 路径手工登记（指纹可 verify），audit 期望/在册/pin 三断言全过。跑 sync 跳过
# 本集、以 audit+verify 为准。
#
# 用法：
#   uv run --no-project $R/source_ledger.py --project $P sync --map <本文件> --episode 1
#   uv run --no-project $R/source_ledger.py --project $P audit --map <本文件> --episode 1

