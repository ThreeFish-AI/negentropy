# 系列信源地图（机器可读 SSOT）——《Claude Code 通俗全解》的 章→集 归属唯一登记处。
# 人读版：claude-code-explained.md；与 series.json（机器）/ series.md（人读）同一配对纪律。
#
# ── 站点↔仓库修订分叉（全系列唯一登记处，各集 notes 只链接不重述） ─────────────
# 课程信源在 2026-07/08 出现**双轨修订**，两轨的章号不共用：
#   · 站点（siteBase）= **20 章版**：内容与仓库分支 fix/s08-s20-sync-frontmatter-parser
#     @ 67a9126c（2026-07-28）逐字一致，中文文件名是 README.md；
#   · 仓库 main @ f9e8b28（2026-08-18）已**整合为 17 章**：中文章名 README.zh.md，
#     s10_system_prompt/s11_error_recovery 并入 s15_integrated_harness，
#     s16_team_protocols/s17_autonomous_agents/s18_worktree_isolation 并入 s13_agent_teams，
#     s20_comprehensive 对应（扩写为）s15_integrated_harness，另新增
#     s16_workflow_runtime/s17_goal_loop（本系列不覆盖）。
# 这是 ISSUE-165「站点 LOC 复算不出」的真正根因：站点整站是课程的旧修订。
# 故双钉（[[pin]]）：ep1 钉 main（其记忆点「看内容块别信停止标记」正依赖 main 比站点新），
# ep2–ep5 钉站点同源修订（用户 5 分组只在该修订下成立）。
#
# ── 本文件是 chapter→episode 映射的唯一住所 ─────────────────────────────────
# 各集 research/source-notes.md 只链接 ../source-map/claude-code-explained.md，
# **永不重述**章号归属与钉选——重述即第二事实源，两轨章号错位时必然漂移。
#
# 用法：
#   uv run --no-project $R/source_ledger.py --project $P sync --map <本文件> --episode 2
#   uv run --no-project $R/source_ledger.py --project $P audit --map <本文件> --episode 1

