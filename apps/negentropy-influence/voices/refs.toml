# 参考音色样本清单（唯一入库文件——voices/ 其余内容因生物特征隐私被 gitignore，
# 本文件经 .gitignore 白名单例外放行）。指纹口径：sha1 取前 12 位（同 tts.py 摘要），
# sha256 为完整指纹（人工核对用）。verify/rebuild 见 scripts/refs.py。
#
# 关键背景：sunny / sunny-steady 预设的 alpha=0.35 是在 me-bright 选段上标定的
#（Qwen 原始 Σ=0.8 会把克隆音高推到 199–223 Hz，本人自然区间 142–163 Hz），
# 复现的不是这个选段，标定即失效——重建后必须 verify。

