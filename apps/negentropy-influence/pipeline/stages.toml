# 九阶段唯一声明（机制事实源）
#
# 此前「有哪九个阶段」同时声明在四处：skills/01–09 的散文标题、pipeline.py 的
# 子命令、README §一 的 mermaid 图、以及 .agent 路由壳的速查表。四份声明可以
# 各自漂移，且已经漂移——文件 06 是第 ⑦ 阶段、文件 07 是第 ⑥ 阶段，这个错位
# 此前只能靠读者自己撞见。本文件把它变成显式数据，由 tests/test_stages.py 执法。
#
# 与 series.json 刻意分开：那是**内容**事实源（有哪些集、什么顺序、什么色板），
# 随每集发布变化；本文件是**机制**事实源，一年动一次。放在一起会诱导出
# 「stage × episode 进度矩阵」——正是 pipeline.py 文件头明令不做的那个状态机。
#
# 字段语义：
#   id       稳定 slug，身份与序号解耦（改序号不影响引用）
#   ordinal  展示序号（① … ⑨）
#   skill    规格文档指针，**子项目相对**（轻量指针，不复制正文）
#   kind     authored = 产出物由人/代理撰写；tooled = 产出物由工具生成。
#            这是本文件唯一真正新增的信息：它解释了「9 阶段 vs 10 个子命令
#            不是 1:1」——authored 阶段本就不该有子命令。注意 ⑦ 虽在生产层，
#            但每集 3000–8000 行场景代码是创作而非生成，故为 authored。
#   commands 归属本阶段的 pipeline.py 子命令（空 = 该阶段不经单入口执行）
#   gate     通过门（散文，与 skills 文档中的判据同源）
#
# **刻意不含** DAG/prerequisites（顺序线性，唯一的非线性边只活在给人看的
# mermaid 里，零工具消费）、inputs/outputs（同理），以及任何阶段状态字段。
# 尤其：`cmd_status` 绝不消费本文件——它一旦开始遍历此处声明的产物清单，
# 就等于把 pipeline.py 明令禁止的阶段状态机悄悄建起来了。

[[stage]]
id = "source-extraction"
ordinal = "①"
name = "信源精读取证"
skill = "pipeline/skills/01-source-extraction.md"
kind = "authored"
commands = []
gate = "全部断言可回溯；RISKY=0"

[[stage]]
id = "planning"
ordinal = "②"
name = "策划案生成"
skill = "pipeline/skills/02-planning.md"
kind = "authored"
commands = []
gate = "planning.md 六节齐"

[[stage]]
id = "narration"
ordinal = "③"
name = "逐字稿写作"
skill = "pipeline/skills/03-narration.md"
kind = "authored"
commands = ["build"]
gate = "build_narration.py 通过（narration.json 是派生物）"

[[stage]]
id = "verification"
ordinal = "④"
name = "双重校验：真实性 + 易懂性"
skill = "pipeline/skills/04-verification.md"
kind = "authored"
commands = ["check"]
gate = "RISKY=0 且 REWRITE=0"

[[stage]]
id = "storyboard"
ordinal = "⑤"
name = "分镜表生成"
skill = "pipeline/skills/05-storyboard.md"
kind = "authored"
commands = ["check"]
gate = "beat 覆盖率无缺句（--check-scenes 分镜↔代码互比）"

[[stage]]
id = "tts-voice"
ordinal = "⑥"
name = "TTS 配音：声音克隆决策树"
# ★ 序号 ⑥ ↔ 文件 07：错位在此显式化，勿据序号猜文件名
skill = "pipeline/skills/07-tts-voice.md"
kind = "tooled"
commands = ["tts", "captions"]
gate = "refs 指纹门 + 试听定档 + ETA 排期"

[[stage]]
id = "remotion-scenes"
ordinal = "⑦"
name = "Remotion 场景实现"
# ★ 序号 ⑦ ↔ 文件 06：同上。commands 为空是实情——tsc 与 remotion 均直调
#   ./node_modules/.bin/（防污染根 workspace），不经 pipeline.py。
skill = "pipeline/skills/06-remotion-implementation.md"
kind = "authored"
commands = []
gate = "tsc --noEmit 零错误 + 七条渲染红线"

[[stage]]
id = "render-qa"
ordinal = "⑧"
name = "草渲 + 抽帧 QA"
skill = "pipeline/skills/08-render-qa.md"
kind = "tooled"
commands = ["render", "qa"]
gate = "qa --check 自动体检零 FAIL（含尾幕渐黑必查）"

[[stage]]
id = "final-render"
ordinal = "⑨"
name = "终渲与交付"
skill = "pipeline/skills/09-final-render.md"
kind = "tooled"
commands = ["render", "captions"]
gate = "实测时长落在 pipeline.toml 的预算窗内"
