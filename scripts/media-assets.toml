#
# 纪律：
#   1. 新增/更换媒体文件 → 先在此登记（path/sha256/bytes/reason），再
#      `uv run --no-project scripts/check_media_assets.py --sync` 重放 .gitignore
#      白名单块，然后正常 git add。
#   2. 未登记的 *.mp3/*.mp4/*.wav/… 一律不入库（.gitignore 通用规则默认忽略；
#      即便被 -f 强加，check_media_assets --check 也会以「已入库媒体 ⊆ 登记表」拦下）。
#   3. 文件被替换（sha256 变了）必须同步更新本表——钩子按指纹对账，替换不登记即红。
#   4. 大文件注意 pre-commit check-added-large-files 的 --maxkb=1024 上限，
#      超限需走 Git LFS 决策（本表不覆盖 LFS 指针文件）。
#
# 校验与白名单生成：scripts/check_media_assets.py（--sync / --check）。

